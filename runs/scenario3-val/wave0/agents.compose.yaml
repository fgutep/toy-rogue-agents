services:
  agent-agent-01:
    image: agentlab-agent:latest
    command:
    - python
    - -m
    - agentlab.agent_entry
    networks:
    - agentlab-agents-agent-01
    environment:
      AGENTLAB_AGENT_CONFIG: /agent/config.yaml
      AGENTLAB_SYSTEM_PROMPT: /agent/system_prompt.md
      AGENTLAB_INITIAL_MSGS: /agent/initial.json
      AGENTLAB_WORKSPACE: /workspace
      AGENTLAB_TELEMETRY: http://telemetry-sink:8900/events
      AGENTLAB_ORACLE_URL: http://oracle:8600/submit
      AGENTLAB_ARMORY_URL: http://armory:8800/cache
      ARMORY_TOKEN: ${ARMORY_TOKEN}
      AGENTLAB_PROXY_URL: http://egress-proxy-agent-01:3128
      AGENTLAB_EGRESS_ALLOW: api.openai.com,armory,egress-proxy,honeypot,oracle,target-64512849943c,target-8533aa6090a5,target-92e19522d478
      HTTP_PROXY: http://egress-proxy-agent-01:3128
      HTTPS_PROXY: http://egress-proxy-agent-01:3128
      NO_PROXY: telemetry-sink,localhost,127.0.0.1
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    volumes:
    - type: bind
      source: /home/felipe/Documents/toy-rogue-agents/runs/scenario3-val/wave0/agents/agent-01
      target: /agent
      read_only: true
    - type: volume
      source: ws-agent-01
      target: /workspace
    - type: tmpfs
      target: /tmp
    read_only: true
    cap_drop: &id001
    - ALL
    security_opt: &id002
    - no-new-privileges:true
    pids_limit: 256
    mem_limit: 1g
    cpus: '1.0'
    user: 10001:10001
    restart: 'no'
    depends_on:
      telemetry-sink:
        condition: service_started
      oracle:
        condition: service_started
      armory:
        condition: service_started
      honeypot:
        condition: service_started
      egress-proxy-agent-01:
        condition: service_healthy
      armory-seeder:
        condition: service_completed_successfully
  egress-proxy-agent-01:
    image: agentlab-agent:latest
    command:
    - python
    - -m
    - agentlab.proxy.proxy
    networks:
    - agentlab-agents-agent-01
    - agentlab-services
    environment:
      AGENTLAB_EGRESS_ALLOW: api.openai.com,armory,egress-proxy,honeypot,oracle,target-64512849943c,target-8533aa6090a5,target-92e19522d478
      AGENTLAB_PROXY_PORT: '3128'
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import socket; socket.create_connection(('127.0.0.1',3128),2).close()
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 2s
    read_only: true
    tmpfs:
    - /tmp
    cap_drop:
