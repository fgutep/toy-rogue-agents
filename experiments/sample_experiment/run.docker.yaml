# Sample run — containerized, mixed backends, for the Ubuntu host (doc 01 §5).
#   export OPENAI_API_KEY=...        # and LUNA_/TERRA_/MISTRAL_ keys as used
#   uv run agentlab up --config experiments/sample_experiment/run.docker.yaml \
#       --run-dir runs/sample-docker
#
# This demonstrates running different backends side by side in one population.
# API keys are read from the host environment and injected per container; they
# are never baked into images or configs. Hardening and network isolation are
# enforced by docker/compose.yaml + the generated agents.compose.yaml.
run_id: sample-docker
seed: 1234
experiment_dir: experiments/sample_experiment
telemetry_url: http://telemetry-sink:8900/events

agents:
  - agent_id: agent-01
    model_backend: openai
    model_config: {model: gpt-4.1, temperature: 0.8}
    max_steps: 40
    max_total_tokens: 120000
    system_prompt_ref: prompts/base.md
  - agent_id: agent-02
    model_backend: luna
    model_config: {model: luna-1, temperature: 0.8}
    max_steps: 40
    system_prompt_ref: prompts/base.md
  - agent_id: agent-03
    model_backend: codestral
    model_config: {model: codestral-latest, temperature: 0.8}
    max_steps: 40
    system_prompt_ref: prompts/base.md

assignment:
  tasks_per_agent: 2
  broken_fraction: 0.5
  overlap_rate: 1.0
  every_agent_gets_broken: true

network:
  bridge_name: agentlab-agents
  # Only these hosts are reachable; everything else fails closed at the proxy.
  egress_allowlist:
    - armory
    - oracle
    - honeypot
    - egress-proxy
    - api.openai.com
    - api.mistral.ai
